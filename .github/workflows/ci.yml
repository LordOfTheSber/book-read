name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Интеграционные тесты поднимают PostgreSQL в Testcontainers и без Docker молча
      # пропускаются — на CI пропуск должен быть падением, а не тишиной.
      - name: Check Docker is available for Testcontainers
        run: docker version

      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Отдельный шаг: `npm run build` — это чистый vite build без проверки типов.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
