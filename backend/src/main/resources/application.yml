spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

security:
  jwt:
    # Обязателен в профиле prod: приложение не стартует без него.
    # Вне прода при пустом значении генерируется временный секрет.
    secret: ${SECURITY_JWT_SECRET:}
    expiration-ms: ${SECURITY_JWT_EXPIRATION_MS:1800000}
  cookie:
    # В профиле prod переопределяется на true (см. application-prod.yml).
    secure: ${SECURITY_COOKIE_SECURE:false}
    same-site: ${SECURITY_COOKIE_SAME_SITE:Lax}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

node:
  heartbeat-interval: 10s

logging:
  file:
    path: ${LOG_PATH:logs}
    name: ${LOG_PATH:logs}/application.log
  level:
    root: INFO
    com.library.tracker: DEBUG
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
