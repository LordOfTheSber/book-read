services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, generate it with `openssl rand -base64 24`}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/library}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-library}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required and must match POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET is required, generate it with `openssl rand -base64 48`}
      SECURITY_COOKIE_SECURE: ${SECURITY_COOKIE_SECURE:-true}
    volumes:
      # Обложки лежат на диске бэкенда (storage.type=filesystem, каталог /app/storage). Без тома
      # они пропадают при каждой пересборке контейнера — то есть при каждом запуске установщика.
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    environment:
      DOMAIN: ${DOMAIN:-book.read.katernyuk.s.m}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/etc/nginx/certs/privkey.pem}
    ports:
      - "80:80"
      # Nginx слушает HTTPS на 9443 (frontend/nginx/default.conf.template), и на этот же порт
      # уходит редирект с 80. Номер снаружи должен совпадать: иначе редирект ведёт в никуда.
      - "9443:9443"
    depends_on:
      - backend
    volumes:
      # Путь относительный, и Compose считает его от каталога compose-файла, то есть от deploy/.
      # Сертификаты установщик кладёт в deploy/certs — здесь должно быть ./certs, а не ./deploy/certs.
      - ./certs:/etc/nginx/certs

volumes:
  db_data:
  backend_storage:
